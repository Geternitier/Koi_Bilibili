[project]
name = "koi-plugin-bilibili"
version = "0.1.0"
description = "Koi 的 B 站插件：扫码登录、浏览、按真实时间观看"
readme = "plugin-bilibili.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "imageio-ffmpeg>=0.5",
    "koi",
    "pydantic>=2.8",
]

[project.scripts]
koi-plugin-bilibili = "koi_bilibili.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv.sources]
koi = { path = "../Koi", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["koi_bilibili"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["tests", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
